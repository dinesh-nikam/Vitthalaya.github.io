[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "music-intelligence-platform"
version = "1.0.0"
description = "Comprehensive Music Research, Composition & Lyrics Intelligence Platform powered by Scrapling"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Music Intelligence Engineering Team" }
]
dependencies = [
    "scrapling[fetchers]>=0.5.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.5",
    "pyyaml>=6.0.2",
    "tenacity>=8.5.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
