openapi: 3.0.0
info:
  title: Vitthalaya (Digital Pandharpur) REST API
  description: Production-ready REST APIs for authentication, search, AI assistant, public catalog, and pilgrimage routes.
  version: 1.0.0
servers:
  - url: https://vitthalaya.org/api
    description: Production Server
  - url: http://localhost:3000/api
    description: Local Dev Server
paths:
  /auth/register:
    post:
      summary: Register a new contributor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  example: ज्ञानेश्वर महाराज
                email:
                  type: string
                  format: email
                  example: dnyaneshwar@warkari.org
                password:
                  type: string
                  format: password
                  minLength: 6
                  example: vitthal123
      responses:
        '201':
          description: Contributor registered successfully, OTP sent to email.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  userId:
                    type: string
                  email:
                    type: string
        '400':
          description: Validation errors (e.g. email already exists, weak password)
        '500':
          description: Server error

  /auth/verify-email:
    post:
      summary: Verify email using OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - token
              properties:
                email:
                  type: string
                  format: email
                  example: dnyaneshwar@warkari.org
                token:
                  type: string
                  length: 6
                  example: '123456'
      responses:
        '200':
          description: Email verified successfully.
        '400':
          description: Invalid or expired OTP.

  /auth/forgot-password:
    post:
      summary: Request password reset link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: dnyaneshwar@warkari.org
      responses:
        '200':
          description: Recovery link logged / sent.

  /auth/reset-password:
    post:
      summary: Reset password with token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - token
                - password
              properties:
                email:
                  type: string
                  format: email
                token:
                  type: string
                password:
                  type: string
                  minLength: 6
      responses:
        '200':
          description: Password reset successful.

  /search:
    get:
      summary: Search compositions, categories, saints, and festivals
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          example: माऊली
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum: [search, suggest]
          example: search
      responses:
        '200':
          description: Search results or suggestions retrieved successfully.

  /ai/assistant:
    post:
      summary: Interact with the AI Devotional Assistant
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  example: ज्ञानेश्वरांचे हरिपाठातील मुख्य तत्व काय आहे?
      responses:
        '200':
          description: AI response retrieved successfully.
        '429':
          description: Rate limit exceeded (max 5 requests per minute).

  /v1/compositions:
    get:
      summary: List compositions with pagination and filters
      tags:
        - Public v1 - Compositions
      security:
        - ApiKeyAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Page number (1-based)
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 50
          description: Items per page
        - name: type
          in: query
          schema:
            type: string
          description: Composition type filter (e.g. abhang, bhajan)
        - name: saint
          in: query
          schema:
            type: string
          description: Filter by saint slug
        - name: deity
          in: query
          schema:
            type: string
          description: Filter by deity transliterated name
        - name: q
          in: query
          schema:
            type: string
          description: Search query matching Marathi or transliterated title
      responses:
        '200':
          description: Paginated list of compositions
        '401':
          description: Missing or invalid API key
        '429':
          description: Rate limit exceeded
        '500':
          description: Server error

  /v1/compositions/{id}:
    get:
      summary: Get composition detail by ID or slug
      tags:
        - Public v1 - Compositions
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Composition UUID or slug
      responses:
        '200':
          description: Full composition details with lyrics and metadata
        '400':
          description: Invalid identifier parameter
        '401':
          description: Missing or invalid API key
        '404':
          description: Composition not found
        '429':
          description: Rate limit exceeded
        '500':
          description: Server error

  /v1/saints:
    get:
      summary: List all saints with pagination
      tags:
        - Public v1 - Saints
      security:
        - ApiKeyAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Page number (1-based)
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 50
          description: Items per page
      responses:
        '200':
          description: Paginated list of saints with composition counts
        '401':
          description: Missing or invalid API key
        '429':
          description: Rate limit exceeded
        '500':
          description: Server error

  /v1/saints/{slug}:
    get:
      summary: Get saint detail and compositions by slug
      tags:
        - Public v1 - Saints
      security:
        - ApiKeyAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          description: Saint slug identifier
      responses:
        '200':
          description: Saint biography and recent compositions
        '400':
          description: Invalid slug parameter
        '401':
          description: Missing or invalid API key
        '404':
          description: Saint not found
        '429':
          description: Rate limit exceeded
        '500':
          description: Server error

  /v1/wari/stops:
    get:
      summary: List Wari pilgrimage route stops
      tags:
        - Public v1 - Pilgrimage
      security:
        - ApiKeyAuth: []
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
          description: Sort by route milestone order
        - name: minDistance
          in: query
          schema:
            type: integer
            minimum: 0
          description: Filter stops after specific route kilometer
        - name: maxDistance
          in: query
          schema:
            type: integer
            minimum: 0
          description: Filter stops before specific route kilometer
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
          description: Maximum items to return
        - name: cursor
          in: query
          schema:
            type: string
          description: Base64url pagination cursor
      responses:
        '200':
          description: Ordered list of pilgrimage stops with cursor metadata
        '400':
          description: Malformed query or cursor token
        '401':
          description: Missing or invalid API key
        '429':
          description: Rate limit exceeded
        '500':
          description: Server error

  /nityanem:
    get:
      summary: Retrieve traditional Varkari Nityanem 5-prohar routine, stop bhajans, and metronome taals
      parameters:
        - name: prohar
          in: query
          schema:
            type: string
            enum: [KAKAD_AARTI, HARIPATH, GAULANI, DHUPARTI, SHEJARTI]
          description: Specific devotional watch to retrieve (defaults to server IST current watch)
        - name: limit
          in: query
          schema:
            type: integer
            default: 8
            maximum: 50
          description: Maximum compositions to retrieve for the watch
      responses:
        '200':
          description: Nityanem payload with active prohar, compositions, taals, and wari stops
        '400':
          description: Invalid prohar parameter
        '500':
          description: Internal server error

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key passed via the X-API-Key header for public v1 routes
    CookieAuth:
      type: apiKey
      in: cookie
      name: next-auth.session-token
