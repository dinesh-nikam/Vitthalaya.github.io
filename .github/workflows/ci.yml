name: CI / CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: varkari_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d varkari_ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The build script runs `prisma db push` + `db:seed`, which need a DB.
      # This points only at the throwaway container above — never a dev/prod DB.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/varkari_ci_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint code
        run: bun run lint

      - name: Type check (tsc --noEmit)
        run: bun run typecheck

      - name: OpenAPI doc-lint
        run: bun run doc:lint

      - name: Run unit tests
        run: bun test

      - name: Build production bundle
        run: bun run build

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next

  # Deploy to Vercel on push to main
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository (for deployment)
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: .
